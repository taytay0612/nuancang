<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>暖仓 v1.0</title>
<style>
:root {
  --paper: #f3e9dc;
  --paper-2: #fbf5ec;
  --paper-3: #efe2d1;
  --wood-1: #d3ab7e;
  --wood-2: #bd8f60;
  --wood-3: #96683f;
  --wood-4: #7a5230;
  --ink: #3a2e25;
  --ink-2: #6d5c4d;
  --ink-3: #94816f;
  --line: #ddc9ae;
  --line-2: #cbb28f;
  --accent: #a75d38;
  --accent-2: #c07a4e;
  --ok: #6d8a55;
  --danger: #b04a37;
  --shadow-s: 0 1px 2px rgba(88, 64, 42, .10);
  --shadow-m: 0 6px 18px rgba(88, 64, 42, .12);
  --shadow-l: 0 18px 48px rgba(76, 54, 34, .22);
  --radius: 14px;
}

* { box-sizing: border-box; }

[hidden] { display: none !important; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
}

body {
  font-family: "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", sans-serif;
  color: var(--ink);
  background-color: var(--paper);
  background-image:
    radial-gradient(circle at 12% 8%, rgba(255, 255, 255, .55), transparent 42%),
    radial-gradient(circle at 88% 92%, rgba(190, 148, 104, .18), transparent 46%),
    repeating-linear-gradient(0deg, rgba(160, 120, 80, .045) 0 1px, transparent 1px 3px),
    repeating-linear-gradient(90deg, rgba(160, 120, 80, .035) 0 1px, transparent 1px 4px);
  font-size: 14px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}

button, input, select, textarea {
  font-family: inherit;
  font-size: inherit;
  color: inherit;
}

button { cursor: pointer; }

::selection { background: rgba(167, 93, 56, .22); }

/* ---------- top bar ---------- */

.topbar {
  position: sticky;
  top: 0;
  z-index: 40;
  display: grid;
  grid-template-columns: auto minmax(280px, 1fr) auto;
  align-items: center;
  gap: 22px;
  padding: 12px 26px;
  background: linear-gradient(180deg, rgba(251, 245, 236, .97), rgba(246, 236, 223, .94));
  border-bottom: 1px solid var(--line);
  backdrop-filter: blur(8px);
}

.brand {
  display: flex;
  align-items: center;
  gap: 11px;
  user-select: none;
}

.logo {
  width: 40px;
  height: 40px;
  display: grid;
  place-items: center;
  border-radius: 12px;
  color: #fff8ef;
  font-size: 21px;
  font-weight: 700;
  background: linear-gradient(145deg, var(--wood-2), var(--wood-4));
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .35), var(--shadow-s);
}

.brand h1 {
  margin: 0;
  font-size: 18px;
  letter-spacing: .5px;
  line-height: 1.15;
}

.brand p {
  margin: 0;
  font-size: 11px;
  color: var(--ink-3);
  letter-spacing: .8px;
}

.search {
  position: relative;
  display: flex;
  align-items: center;
}

.search input {
  width: 100%;
  height: 40px;
  padding: 0 74px 0 38px;
  border: 1px solid var(--line-2);
  border-radius: 11px;
  background: rgba(255, 252, 247, .9);
  box-shadow: inset 0 1px 3px rgba(120, 90, 60, .08);
  outline: none;
  transition: border-color .15s, box-shadow .15s;
}

.search input:focus {
  border-color: var(--wood-2);
  box-shadow: 0 0 0 3px rgba(189, 143, 96, .18);
}

.search .ico {
  position: absolute;
  left: 13px;
  color: var(--ink-3);
  pointer-events: none;
}

.search kbd {
  position: absolute;
  right: 10px;
  padding: 2px 7px;
  font-size: 11px;
  color: var(--ink-3);
  border: 1px solid var(--line);
  border-radius: 6px;
  background: var(--paper-2);
}

.search-panel {
  position: absolute;
  top: 46px;
  left: 0;
  right: 0;
  max-height: 420px;
  overflow: auto;
  padding: 8px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--paper-2);
  box-shadow: var(--shadow-m);
}

.result {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 4px 12px;
  padding: 9px 11px;
  border-radius: 9px;
  cursor: pointer;
}

.result:hover, .result.active { background: rgba(189, 143, 96, .15); }

.result .r-name { font-weight: 600; }
.result .r-sub { grid-column: 1 / -1; font-size: 12px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.result .r-pos { font-family: Consolas, "Courier New", monospace; font-size: 12px; color: var(--ink-3); }
.result-empty { padding: 18px; text-align: center; color: var(--ink-3); }
mark { background: #ffe6a8; color: inherit; padding: 0 2px; border-radius: 3px; }

.actions { display: flex; gap: 8px; }

.btn {
  height: 38px;
  padding: 0 14px;
  border: 1px solid var(--line-2);
  border-radius: 10px;
  background: linear-gradient(180deg, #fffdf9, #f4e9da);
  box-shadow: var(--shadow-s);
  transition: transform .12s, box-shadow .12s, background .12s;
  white-space: nowrap;
}

.btn:hover { transform: translateY(-1px); box-shadow: var(--shadow-m); }
.btn:active { transform: translateY(0); }

.btn-primary {
  border-color: var(--wood-3);
  color: #fff8ef;
  background: linear-gradient(180deg, var(--wood-2), var(--wood-3));
}

.btn-primary:hover { background: linear-gradient(180deg, #c99a6b, #a2714a); }

.btn-ghost { background: transparent; box-shadow: none; }
.btn-ghost:hover { background: rgba(189, 143, 96, .12); box-shadow: none; }

.btn-danger { color: var(--danger); border-color: #dcc0b5; }
.btn-danger:hover { background: #fbeee9; }

.btn-sm { height: 30px; padding: 0 10px; font-size: 13px; border-radius: 8px; }

.count {
  display: inline-block;
  min-width: 18px;
  padding: 0 5px;
  margin-left: 2px;
  font-size: 11px;
  line-height: 18px;
  text-align: center;
  border-radius: 9px;
  color: #fff;
  background: var(--accent);
}

/* ---------- layout ---------- */

main {
  max-width: 1200px;
  margin: 0 auto;
  padding: 26px 26px 80px;
}

.view-head {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 18px;
  margin-bottom: 18px;
}

.view-head h2 {
  margin: 0;
  font-size: 22px;
  letter-spacing: .5px;
}

.view-head .sub {
  margin: 4px 0 0;
  color: var(--ink-2);
  font-size: 13px;
}

.stats { display: flex; gap: 10px; flex-wrap: wrap; }

.stat {
  min-width: 92px;
  padding: 8px 12px;
  border: 1px solid var(--line);
  border-radius: 11px;
  background: rgba(255, 252, 247, .8);
  box-shadow: var(--shadow-s);
}

.stat b { display: block; font-size: 18px; line-height: 1.2; }
.stat span { font-size: 11px; color: var(--ink-3); letter-spacing: .5px; }

/* ---------- room plan ---------- */

.plan-card {
  position: relative;
  padding: 18px;
  border: 1px solid var(--line);
  border-radius: 18px;
  background:
    linear-gradient(180deg, rgba(255, 253, 249, .92), rgba(248, 239, 227, .88));
  box-shadow: var(--shadow-m);
}

.plan-svg { width: 100%; height: auto; max-height: 64vh; display: block; }

.room-floor { fill: #f7efe3; stroke: none; }
.room-wall { fill: none; stroke: var(--wood-3); stroke-width: 5; stroke-linejoin: round; }
.room-grid line { stroke: rgba(150, 104, 63, .12); stroke-width: 1; }

.cabinet-shape { fill: url(#woodFill); stroke: var(--wood-3); stroke-width: 2; cursor: pointer; transition: filter .15s, transform .15s; transform-origin: center; }
.cabinet-node:hover .cabinet-shape { filter: brightness(1.06); }
.cabinet-node:focus { outline: none; }
.cabinet-node:focus .cabinet-shape { stroke: var(--accent); stroke-width: 3; }

.cabinet-face { fill: rgba(255, 250, 243, .82); stroke: rgba(150, 104, 63, .35); stroke-width: 1; }
.cabinet-shelf { stroke: rgba(122, 82, 48, .45); stroke-width: 1; }

.cabinet-label { font-size: 15px; font-weight: 700; fill: var(--ink); }
.cabinet-meta { font-size: 11px; fill: var(--ink-2); }
.cabinet-fill { fill: var(--accent); font-size: 11px; font-weight: 600; }

.legend {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 16px;
  margin-top: 14px;
  padding-top: 14px;
  border-top: 1px dashed var(--line);
  font-size: 12px;
  color: var(--ink-2);
}

.legend i {
  display: inline-block;
  width: 10px;
  height: 10px;
  margin-right: 6px;
  border-radius: 3px;
  vertical-align: -1px;
}

/* ---------- cabinet view ---------- */

.crumbs { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-3); margin-bottom: 10px; }
.crumbs a { color: var(--accent); cursor: pointer; text-decoration: none; }
.crumbs a:hover { text-decoration: underline; }

.cabinet-frame {
  padding: 16px 18px 20px;
  border: 1px solid var(--line-2);
  border-radius: 16px;
  background:
    linear-gradient(180deg, rgba(255, 252, 246, .95), rgba(246, 235, 220, .92));
  box-shadow: var(--shadow-m);
}

.floor {
  display: grid;
  grid-template-columns: 96px 1fr;
  gap: 14px;
  align-items: stretch;
  padding: 10px 0;
  border-bottom: 1px dashed rgba(150, 104, 63, .22);
}

.floor:last-child { border-bottom: none; }

.floor-label {
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding-left: 4px;
  color: var(--ink-2);
  font-size: 13px;
}

.floor-label b { font-size: 15px; color: var(--ink); }
.floor-label span { font-size: 11px; color: var(--ink-3); }

.slots {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(148px, 1fr));
  gap: 10px;
}

.slot {
  position: relative;
  min-height: 92px;
  border-radius: 11px;
  text-align: left;
  overflow: hidden;
  transition: transform .13s, box-shadow .13s;
}

.slot:hover { transform: translateY(-2px); }

.slot.empty {
  display: grid;
  place-items: center;
  border: 1px dashed var(--line-2);
  background: rgba(255, 253, 249, .55);
  color: var(--ink-3);
}

.slot.empty:hover { border-color: var(--wood-2); color: var(--accent); background: rgba(255, 250, 242, .9); }

.slot.empty .plus { font-size: 22px; line-height: 1; font-weight: 300; }
.slot.empty .pos { font-family: Consolas, monospace; font-size: 11px; opacity: .75; }

.box-card {
  width: 100%;
  height: 100%;
  min-height: 92px;
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding: 10px 12px 10px 14px;
  border: 1px solid rgba(122, 82, 48, .28);
  border-left: 5px solid var(--cat, var(--wood-2));
  border-radius: 11px;
  background: linear-gradient(180deg, #fffdf9, #f7ecdd);
  box-shadow: var(--shadow-s);
  text-align: left;
  color: var(--ink);
}

.box-card:hover { box-shadow: var(--shadow-m); }

.box-name { font-weight: 700; font-size: 14px; line-height: 1.35; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.box-kw { font-size: 12px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.box-pos { margin-top: auto; font-family: Consolas, monospace; font-size: 11px; color: var(--ink-3); letter-spacing: .3px; }

.tag {
  display: inline-block;
  padding: 1px 7px;
  font-size: 11px;
  border-radius: 20px;
  color: #fff;
  background: var(--cat, var(--wood-2));
}

.empty-hint {
  padding: 46px 20px;
  text-align: center;
  color: var(--ink-2);
}

.empty-hint h3 { margin: 0 0 6px; font-size: 17px; color: var(--ink); }
.empty-hint p { margin: 0 0 16px; font-size: 13px; }

/* ---------- drawer ---------- */

.drawer-backdrop {
  position: fixed;
  inset: 0;
  z-index: 60;
  background: rgba(58, 44, 32, .28);
  opacity: 0;
  transition: opacity .18s;
}

.drawer-backdrop.open { opacity: 1; }

.drawer {
  position: fixed;
  top: 0;
  right: 0;
  bottom: 0;
  z-index: 61;
  width: 420px;
  max-width: 92vw;
  display: flex;
  flex-direction: column;
  background: var(--paper-2);
  border-left: 1px solid var(--line);
  box-shadow: var(--shadow-l);
  transform: translateX(102%);
  transition: transform .22s cubic-bezier(.2, .7, .3, 1);
}

.drawer.open { transform: translateX(0); }

.drawer-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  padding: 20px 22px 14px;
  border-bottom: 1px solid var(--line);
}

.drawer-head h3 { margin: 0 0 4px; font-size: 19px; }
.drawer-head .pos { font-family: Consolas, monospace; font-size: 12px; color: var(--ink-2); letter-spacing: .4px; }

.icon-btn {
  width: 30px;
  height: 30px;
  display: grid;
  place-items: center;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: transparent;
  color: var(--ink-2);
  font-size: 16px;
  line-height: 1;
}

.icon-btn:hover { background: rgba(189, 143, 96, .14); }

.drawer-body { flex: 1; overflow: auto; padding: 18px 22px; }

.field { margin-bottom: 16px; }
.field label { display: block; font-size: 12px; color: var(--ink-3); margin-bottom: 4px; letter-spacing: .3px; }
.field .value { font-size: 14px; white-space: pre-wrap; word-break: break-word; }
.field .value.mono { font-family: Consolas, monospace; font-size: 13px; }

.drawer-foot {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  padding: 14px 22px 20px;
  border-top: 1px solid var(--line);
  background: rgba(246, 236, 223, .6);
}

.timeline { border-left: 2px solid var(--line); margin: 6px 0 0 6px; padding-left: 14px; }
.timeline-item { position: relative; padding-bottom: 12px; font-size: 12px; color: var(--ink-2); }
.timeline-item::before {
  content: "";
  position: absolute;
  left: -20px;
  top: 5px;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--wood-2);
  box-shadow: 0 0 0 3px var(--paper-2);
}
.timeline-item b { color: var(--ink); font-weight: 600; }
.timeline-item time { display: block; color: var(--ink-3); font-size: 11px; }

/* ---------- modal ---------- */

.backdrop {
  position: fixed;
  inset: 0;
  z-index: 70;
  display: grid;
  place-items: center;
  padding: 24px;
  background: rgba(58, 44, 32, .34);
  animation: fade .16s ease;
}

@keyframes fade { from { opacity: 0; } to { opacity: 1; } }

.modal {
  width: 560px;
  max-width: 100%;
  max-height: 88vh;
  display: flex;
  flex-direction: column;
  border-radius: 18px;
  background: var(--paper-2);
  border: 1px solid var(--line-2);
  box-shadow: var(--shadow-l);
  animation: pop .18s cubic-bezier(.2, .8, .3, 1);
}

.modal.wide { width: 760px; }

@keyframes pop { from { transform: translateY(8px) scale(.985); opacity: 0; } to { transform: none; opacity: 1; } }

.modal-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 18px 22px 12px;
  border-bottom: 1px solid var(--line);
}

.modal-head h3 { margin: 0; font-size: 17px; }
.modal-body { padding: 18px 22px; overflow: auto; }
.modal-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 14px 22px 18px; border-top: 1px solid var(--line); }

.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; }
.form-grid .full { grid-column: 1 / -1; }

.form-grid label { display: block; font-size: 12px; color: var(--ink-3); margin-bottom: 5px; }

.input, select, textarea {
  width: 100%;
  padding: 9px 11px;
  border: 1px solid var(--line-2);
  border-radius: 9px;
  background: #fffdf9;
  outline: none;
  transition: border-color .15s, box-shadow .15s;
}

.input:focus, select:focus, textarea:focus {
  border-color: var(--wood-2);
  box-shadow: 0 0 0 3px rgba(189, 143, 96, .16);
}

textarea { resize: vertical; min-height: 74px; }

.hint { font-size: 12px; color: var(--ink-3); margin: 6px 0 0; }
.req { color: var(--danger); }

.pos-picker { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }

.chip {
  padding: 6px 12px;
  border: 1px solid var(--line-2);
  border-radius: 20px;
  background: #fffdf9;
  font-size: 13px;
}

.chip.on { color: #fff8ef; border-color: var(--wood-3); background: var(--wood-2); }

.chip .x { margin-left: 6px; color: var(--ink-3); }
.chip.on .x { color: rgba(255, 255, 255, .8); }

/* ---------- labels ---------- */

.label-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; max-height: 46vh; overflow: auto; padding: 2px; }

.label-row {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 10px;
  align-items: center;
  padding: 9px 11px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: #fffdf9;
  cursor: pointer;
}

.label-row.on { border-color: var(--wood-2); background: #fdf3e6; }
.label-row .l-name { font-weight: 600; font-size: 13px; }
.label-row .l-pos { font-family: Consolas, monospace; font-size: 11px; color: var(--ink-3); }

.label-preview {
  display: grid;
  place-items: center;
  padding: 14px;
  border: 1px dashed var(--line-2);
  border-radius: 12px;
  background: #fff;
}

.label-preview canvas { width: 295px; height: 177px; box-shadow: var(--shadow-s); }

/* ---------- trash ---------- */

.trash-list { display: flex; flex-direction: column; gap: 10px; }

.trash-item {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 6px 16px;
  align-items: center;
  padding: 14px 16px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: rgba(255, 252, 247, .85);
  box-shadow: var(--shadow-s);
}

.trash-item .t-name { font-weight: 600; }
.trash-item .t-sub { grid-column: 1; font-size: 12px; color: var(--ink-2); }
.trash-item .t-days { font-size: 12px; color: var(--ink-3); }
.trash-item .t-actions { grid-row: 1 / span 2; grid-column: 2; display: flex; gap: 8px; }

/* ---------- misc ---------- */

.toast {
  position: fixed;
  left: 50%;
  bottom: 28px;
  z-index: 90;
  transform: translate(-50%, 20px);
  padding: 10px 18px;
  border-radius: 10px;
  background: rgba(58, 44, 32, .92);
  color: #fdf6ec;
  font-size: 13px;
  opacity: 0;
  pointer-events: none;
  transition: opacity .2s, transform .2s;
  max-width: 80vw;
}

.toast.show { opacity: 1; transform: translate(-50%, 0); }

.section { margin-bottom: 22px; }
.section h4 { margin: 0 0 10px; font-size: 14px; letter-spacing: .3px; }
.section .desc { margin: -4px 0 10px; font-size: 12px; color: var(--ink-3); }

.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.spacer { flex: 1; }

.mono { font-family: Consolas, "Courier New", monospace; }

.divider { height: 1px; background: var(--line); margin: 18px 0; }

.badge-soft {
  padding: 2px 8px;
  border-radius: 20px;
  background: rgba(167, 93, 56, .12);
  color: var(--accent);
  font-size: 12px;
}

.cat-dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: 0; }

@media (max-width: 860px) {
  .topbar { grid-template-columns: 1fr; gap: 10px; }
  .actions { justify-content: flex-start; flex-wrap: wrap; }
  .floor { grid-template-columns: 1fr; }
  .form-grid { grid-template-columns: 1fr; }
  .pos-picker { grid-template-columns: 1fr 1fr; }
}

</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="logo">暖</span>
    <div>
      <h1>暖仓 <span class="badge-soft" id="versionBadge">v1.0</span></h1>
      <p>储藏室编码管理 · 箱级档案</p>
    </div>
  </div>

  <div class="search">
    <span class="ico">⌕</span>
    <input id="searchInput" type="text" placeholder="搜索箱名、内容关键词、位置码…" autocomplete="off" spellcheck="false">
    <kbd>Ctrl K</kbd>
    <div id="searchPanel" class="search-panel" hidden></div>
  </div>

  <nav class="actions">
    <button class="btn" id="btnLabels">标签中心</button>
    <button class="btn" id="btnTrash">回收站<span class="count" id="trashCount" hidden>0</span></button>
    <button class="btn" id="btnSettings">设置与备份</button>
  </nav>
</header>

<main>
  <section id="viewRoom" class="view">
    <div class="view-head">
      <div>
        <h2>房间平面图</h2>
        <p class="sub">点击柜子查看层板。层号从上往下，箱号从左往右。</p>
      </div>

    </div>
    <div class="plan-card">
      <svg id="planSvg" class="plan-svg" viewBox="0 0 900 560" role="img" aria-label="储藏室平面图"></svg>

        <h2 id="cabTitle">柜体</h2>

        <button class="btn btn-primary" id="btnAddHere">+ 新增箱子</button>

  </section>

  <section id="viewTrash" class="view" hidden>
    <div class="view-head">
      <div>
        <h2>回收站</h2>
        <p class="sub">删除的箱子保留 30 天。到期后打开暖仓时自动清理。</p>
      </div>

<div id="drawerBackdrop" class="drawer-backdrop" hidden></div>
<aside id="drawer" class="drawer" aria-hidden="true"></aside>

<div id="modalRoot"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
/* ===================================================================
   暖仓 v1.0 · 核心数据层
   =================================================================== */

const APP_VERSION = 'v1.0';
const TRASH_DAYS = 30;
const LABEL_W = 591;   // 50mm @300dpi
const LABEL_H = 354;   // 30mm @300dpi

const CABINETS = [
  { id: 1, name: '1号柜', kind: 'fixed', floors: 4, perFloor: 5, note: '4 层 × 5 箱' },
  { id: 2, name: '2号柜', kind: 'fixed', floors: 4, perFloor: 5, note: '4 层 × 5 箱' },
  { id: 3, name: '3号柜', kind: 'fixed', floors: 4, perFloor: 4, note: '4 层 × 4 箱' },
  { id: 4, name: '4号柜', kind: 'flex', floors: 4, perFloor: 6, note: '灵活层板 · 按需建箱位' },
  { id: 5, name: '5号柜', kind: 'flex', floors: 4, perFloor: 6, note: '灵活层板 · 按需建箱位' }
];

const DEFAULT_CATEGORIES = ['工具', '五金', '食品', '药品', '文件', '日用品', '衣物', '电子产品', '纪念品', '其他'];

const CAT_PALETTE = [
  '#a7603f', '#8a7b45', '#5f7d63', '#7a6a9a', '#9a5f6a',
  '#4f7a8a', '#8a6a4a', '#6b7f45', '#7d5f8a', '#5f7a7a'
];

const nativeApi = window.暖仓API || null;
const STORAGE_KEY = 'nuancang.v1';

let state = null;
let saveTimer = null;
let currentView = 'room';
let currentCabinet = 1;
let openBoxId = null;

/* ---------------- 位置与编码 ---------------- */

function cabinetOf(id) {
  return CABINETS.find(c => c.id === Number(id));
}

function posCode(cab, floor, slot) {
  return `G${cab}-L${floor}-B${slot}`;
}

function posCn(cab, floor, slot) {
  return `柜${cab} 层${floor} 箱${slot}`;
}

function posKey(cab, floor, slot) {
  return `${cab}-${floor}-${slot}`;
}

function parsePosCode(code) {
  const m = /^G(\d+)-L(\d+)-B(\d+)$/.exec(String(code || '').trim().toUpperCase());
  if (!m) return null;
  return { cabinet: Number(m[1]), floor: Number(m[2]), slot: Number(m[3]) };
}

function boxAt(cab, floor, slot) {
  return state.boxes.find(b => b.cabinet === cab && b.floor === floor && b.slot === slot) || null;
}

function positionLabel(b) {
  return posCn(b.cabinet, b.floor, b.slot);
}

function boxMatches(b, q) {
  if (!q) return true;
  const s = q.trim().toLowerCase();
  if (!s) return true;
  const hay = [
    b.name, b.keywords, b.note, b.category,
    posCode(b.cabinet, b.floor, b.slot),
    posCn(b.cabinet, b.floor, b.slot)
  ].join(' ').toLowerCase();
  return hay.includes(s);
}

/* ---------------- 分类颜色 ---------------- */

function catColor(name) {
  const i = state.categories.indexOf(name);
  if (i >= 0) return CAT_PALETTE[i % CAT_PALETTE.length];
  let h = 0;
  for (const ch of String(name || '')) h = (h * 31 + ch.codePointAt(0)) % 9973;
  return CAT_PALETTE[h % CAT_PALETTE.length];
}

/* ---------------- 状态 ---------------- */

function defaultState() {
  return {
    app: '暖仓',
    schema: 1,
    version: APP_VERSION,
    updatedAt: new Date().toISOString(),
    categories: DEFAULT_CATEGORIES.slice(),
    boxes: [],
    history: [],
    trash: []
  };
}

function normalizeState(raw) {
  const s = Object.assign(defaultState(), raw || {});
  if (!Array.isArray(s.categories) || !s.categories.length) s.categories = DEFAULT_CATEGORIES.slice();
  if (!Array.isArray(s.boxes)) s.boxes = [];
  if (!Array.isArray(s.history)) s.history = [];
  if (!Array.isArray(s.trash)) s.trash = [];
  s.boxes = s.boxes.filter(b => b && b.cabinet && b.floor && b.slot && b.name);
  s.trash = s.trash.filter(t => t && t.box && t.deletedAt);
  return s;
}

async function loadState() {
  try {
    if (nativeApi) {
      const res = await nativeApi.load();
      state = normalizeState(res && res.state);
      if (res && res.recovered) toast('数据文件损坏，已保留 .broken 副本并新建空白数据');
    } else {
      const raw = localStorage.getItem(STORAGE_KEY);
      state = normalizeState(raw ? JSON.parse(raw) : null);
    }
  } catch (err) {
    console.error(err);
    state = defaultState();
    toast('数据读取失败，已使用空白数据');
  }
  purgeExpiredTrash(true);
  renderAll();
}

function saveSoon() {
  if (saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(saveNow, 180);
}

async function saveNow() {
  saveTimer = null;
  state.updatedAt = new Date().toISOString();
  try {
    if (nativeApi) await nativeApi.save(state);
    else localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (err) {
    console.error(err);
    toast('保存失败：' + (err && err.message ? err.message : '未知错误'));
  }
}

function touch(source) {
  state.updatedAt = new Date().toISOString();
  if (source) console.debug('state changed:', source);
  saveSoon();
}

/* ---------------- 数据操作 ---------------- */

function newId() {
  return 'b_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}

function addBox(data) {
  const box = {
    id: newId(),
    cabinet: Number(data.cabinet),
    floor: Number(data.floor),
    slot: Number(data.slot),
    name: String(data.name || '').trim(),
    category: data.category || '未分类',
    keywords: String(data.keywords || '').trim(),
    note: String(data.note || '').trim(),
    weight: data.weight === '' || data.weight == null ? null : Number(data.weight),
    createdAt: new Date().toISOString(),
    updatedAt: new Date().toISOString()
  };
  state.boxes.push(box);
  pushHistory({ type: 'create', box, to: box, text: '新增箱子' });
  touch('addBox');
  return box;
}

function updateBox(id, patch) {
  const box = state.boxes.find(b => b.id === id);
  if (!box) return null;
  Object.assign(box, patch, { updatedAt: new Date().toISOString() });
  touch('updateBox');
  return box;
}

function pushHistory(entry) {
  state.history.unshift(Object.assign({
    id: 'h_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
    at: new Date().toISOString()
  }, entry));
  if (state.history.length > 500) state.history.length = 500;
}

function moveTo(box, cab, floor, slot) {
  const from = { cabinet: box.cabinet, floor: box.floor, slot: box.slot };
  box.cabinet = cab; box.floor = floor; box.slot = slot;
  box.updatedAt = new Date().toISOString();
  pushHistory({ type: 'move', boxId: box.id, name: box.name, from, to: { cabinet: cab, floor, slot }, text: '移动位置' });
  touch('move');
}

function swapBoxes(a, b) {
  const pa = { cabinet: a.cabinet, floor: a.floor, slot: a.slot };
  const pb = { cabinet: b.cabinet, floor: b.floor, slot: b.slot };
  a.cabinet = pb.cabinet; a.floor = pb.floor; a.slot = pb.slot;
  b.cabinet = pa.cabinet; b.floor = pa.floor; b.slot = pa.slot;
  const now = new Date().toISOString();
  a.updatedAt = now; b.updatedAt = now;
  pushHistory({ type: 'swap', boxId: a.id, name: a.name, from: pa, to: pb, text: '与「' + b.name + '」互换位置' });
  pushHistory({ type: 'swap', boxId: b.id, name: b.name, from: pb, to: pa, text: '与「' + a.name + '」互换位置' });
  touch('swap');
}

function deleteBox(id) {
  const idx = state.boxes.findIndex(b => b.id === id);
  if (idx < 0) return;
  const box = state.boxes.splice(idx, 1)[0];
  state.trash.unshift({ box, deletedAt: new Date().toISOString() });
  pushHistory({ type: 'delete', boxId: box.id, name: box.name, from: { cabinet: box.cabinet, floor: box.floor, slot: box.slot }, text: '移入回收站' });
  touch('delete');
}

function restoreBox(trashIndex, cab, floor, slot) {
  const item = state.trash[trashIndex];
  if (!item) return;
  const box = item.box;
  box.cabinet = cab; box.floor = floor; box.slot = slot;
  box.updatedAt = new Date().toISOString();
  state.boxes.push(box);
  state.trash.splice(trashIndex, 1);
  pushHistory({ type: 'restore', boxId: box.id, name: box.name, to: { cabinet: cab, floor, slot }, text: '从回收站恢复' });
  touch('restore');
}

function purgeOne(index) {
  state.trash.splice(index, 1);
  touch('purge');
}

function purgeExpiredTrash(silent) {
  const cutoff = Date.now() - TRASH_DAYS * 86400 * 1000;
  const before = state.trash.length;
  state.trash = state.trash.filter(t => new Date(t.deletedAt).getTime() > cutoff);
  const removed = before - state.trash.length;
  if (removed > 0) {
    touch('purgeExpired');
    if (!silent) toast('已自动清理 ' + removed + ' 个超过 30 天的箱子');
  }
  return removed;
}

function daysLeft(deletedAt) {
  const end = new Date(deletedAt).getTime() + TRASH_DAYS * 86400 * 1000;
  return Math.max(0, Math.ceil((end - Date.now()) / 86400000));
}

function emptySlots(cabinetFilter) {
  const out = [];
  for (const c of CABINETS) {
    if (cabinetFilter && c.id !== cabinetFilter) continue;
    for (let f = 1; f <= c.floors; f++) {
      for (let s = 1; s <= c.perFloor; s++) {
        if (!boxAt(c.id, f, s)) out.push({ cabinet: c.id, floor: f, slot: s });
      }
    }
  }
  return out;
}

function usedCount(cabinetId) {
  return state.boxes.filter(b => b.cabinet === cabinetId).length;
}

function totalCapacity() {
  return CABINETS.filter(c => c.kind === 'fixed').reduce((n, c) => n + c.floors * c.perFloor, 0);
}

/* ---------------- 事件绑定辅助 ---------------- */

function el(tag, attrs, children) {
  const node = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    if (k === 'class') node.className = attrs[k];
    else if (k === 'text') node.textContent = attrs[k];
    else if (k === 'html') node.innerHTML = attrs[k];
    else if (k.startsWith('on') && typeof attrs[k] === 'function') node.addEventListener(k.slice(2), attrs[k]);
    else if (attrs[k] != null && attrs[k] !== false) node.setAttribute(k, attrs[k]);
  }
  if (children) for (const ch of children) {
    if (ch == null) continue;
    node.appendChild(typeof ch === 'string' ? document.createTextNode(ch) : ch);
  }
  return node;
}

function escapeHtml(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function highlight(text, q) {
  const safe = escapeHtml(text);
  if (!q) return safe;
  const needle = q.trim();
  if (!needle) return safe;
  try {
    const re = new RegExp(needle.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
    return safe.replace(re, m => '<mark>' + m + '</mark>');
  } catch (e) {
    return safe;
  }
}

function fmtTime(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d.getTime())) return '';
  const p = n => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}

/* ---------------- Code 128 B ---------------- */

const CODE128_WIDTHS = (
  '212222 222122 222221 121223 121322 131222 122213 122312 132212 221213 ' +
  '221312 231212 112232 122132 122231 113222 123122 123221 223211 221132 ' +
  '221231 213212 223112 312131 311222 321122 321221 312212 322112 322211 ' +
  '212123 212321 232121 111323 131123 131321 112313 132113 132311 211313 ' +
  '231113 231311 112133 112331 132131 113123 113321 133121 313121 211331 ' +
  '231131 213113 213311 213131 311123 311321 331121 312113 312311 332111 ' +
  '314111 221411 431111 111224 111422 121124 121421 141122 141221 112214 ' +
  '112412 122114 122411 142112 142211 241211 221114 413111 241112 134111 ' +
  '111242 121142 121241 114212 124112 124211 411212 421112 421211 212141 ' +
  '214121 412121 111143 111341 131141 114113 114311 411113 411311 113141 ' +
  '114131 311141 411131 211412 211214 211232 2331112'
).trim().split(/\s+/);

if (CODE128_WIDTHS.length !== 107) {
  console.warn('Code128 表长度异常：', CODE128_WIDTHS.length);
}

function code128Values(text) {
  const data = [];
  for (const ch of String(text)) {
    const code = ch.charCodeAt(0);
    if (code < 32 || code > 126) throw new Error('条码只支持 ASCII 字符：' + ch);
    data.push(code - 32);
  }
  const values = [104].concat(data);
  let sum = 104;
  data.forEach((v, i) => { sum += (i + 1) * v; });
  values.push(sum % 103);
  values.push(106);
  return values;
}

function code128Modules(text) {
  const values = code128Values(text);
  const modules = [];
  values.forEach((v, idx) => {
    const pat = CODE128_WIDTHS[v];
    for (let i = 0; i < pat.length; i++) {
      const w = Number(pat[i]);
      const isBar = i % 2 === 0;
      for (let k = 0; k < w; k++) modules.push(isBar ? 1 : 0);
    }
  });
  return modules;
}

function drawBarcode(ctx, text, x, y, width, height) {
  const modules = code128Modules(text);
  const quiet = 10;
  const total = modules.length + quiet * 2;
  const mw = Math.max(1, Math.floor(width / total));
  const drawWidth = mw * total;
  let cx = x + Math.floor((width - drawWidth) / 2) + quiet * mw;

  ctx.save();
  ctx.fillStyle = '#111';
  for (let i = 0; i < modules.length; i++) {
    if (modules[i]) ctx.fillRect(cx, y, mw, height);
    cx += mw;
  }
  ctx.restore();
  return { left: x + Math.floor((width - drawWidth) / 2) + quiet * mw, right: cx - quiet * mw, moduleWidth: mw };
}

/* ---------------- 标签绘制 ---------------- */

function fitText(ctx, text, maxWidth) {
  let s = String(text || '');
  if (ctx.measureText(s).width <= maxWidth) return s;
  while (s.length > 1 && ctx.measureText(s + '…').width > maxWidth) s = s.slice(0, -1);
  return s + '…';
}

function drawLabel(box) {
  const cv = document.createElement('canvas');
  cv.width = LABEL_W;
  cv.height = LABEL_H;
  const ctx = cv.getContext('2d');
  const FONT = '"Microsoft YaHei", "PingFang SC", sans-serif';

  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, LABEL_W, LABEL_H);

  ctx.strokeStyle = '#d8c7b2';
  ctx.lineWidth = 2;
  ctx.strokeRect(8, 8, LABEL_W - 16, LABEL_H - 16);
  ctx.strokeStyle = '#f0e7da';
  ctx.lineWidth = 1;
  ctx.strokeRect(14, 14, LABEL_W - 28, LABEL_H - 28);

  ctx.fillStyle = '#1f1b16';
  ctx.textBaseline = 'alphabetic';
  ctx.font = '700 38px ' + FONT;
  ctx.fillText(posCn(box.cabinet, box.floor, box.slot), 30, 66);

  ctx.fillStyle = '#6b5a48';
  ctx.font = '600 20px Consolas, "Courier New", monospace';
  ctx.fillText(posCode(box.cabinet, box.floor, box.slot), 30, 94);

  ctx.strokeStyle = '#e4d6c2';
  ctx.beginPath();
  ctx.moveTo(30, 108);
  ctx.lineTo(LABEL_W - 30, 108);
  ctx.stroke();

  ctx.fillStyle = '#1f1b16';
  ctx.font = '700 30px ' + FONT;
  ctx.fillText(fitText(ctx, box.name, LABEL_W - 60), 30, 148);

  const cat = box.category || '未分类';
  ctx.font = '600 18px ' + FONT;
  const catW = ctx.measureText(cat).width + 22;
  ctx.fillStyle = '#f3e7d6';
  roundRect(ctx, 30, 160, catW, 28, 14);
  ctx.fill();
  ctx.fillStyle = '#7a5a3c';
  ctx.fillText(cat, 41, 180);

  if (box.weight != null && !isNaN(box.weight)) {
    ctx.fillStyle = '#6b5a48';
    ctx.font = '500 17px ' + FONT;
    ctx.fillText(box.weight + ' kg', 30 + catW + 12, 180);
  }

  drawBarcode(ctx, posCode(box.cabinet, box.floor, box.slot), 24, 202, LABEL_W - 48, 96);

  ctx.fillStyle = '#3c3228';
  ctx.font = '600 17px Consolas, "Courier New", monospace';
  ctx.textAlign = 'center';
  ctx.fillText(posCode(box.cabinet, box.floor, box.slot), LABEL_W / 2, 328);
  ctx.textAlign = 'left';

  return cv;
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

/* ---------------- PNG / ZIP / 文件 ---------------- */

function canvasToBytes(cv) {
  return new Promise((resolve, reject) => {
    cv.toBlob(blob => {
      if (!blob) return reject(new Error('标签生成失败'));
      blob.arrayBuffer().then(buf => resolve(new Uint8Array(buf))).catch(reject);
    }, 'image/png');
  });
}

const CRC_TABLE = (() => {
  const table = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1;
    table[n] = c >>> 0;
  }
  return table;
})();

function crc32(bytes) {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}

function zipStore(files) {
  const enc = new TextEncoder();
  const localParts = [];
  const centralParts = [];
  let offset = 0;
  const now = new Date();
  const dosTime = ((now.getHours() << 11) | (now.getMinutes() << 5) | Math.floor(now.getSeconds() / 2)) & 0xFFFF;
  const dosDate = (((now.getFullYear() - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate()) & 0xFFFF;

  for (const f of files) {
    const nameBytes = enc.encode(f.name);
    const data = f.data;
    const crc = crc32(data);

    const local = new Uint8Array(30 + nameBytes.length);
    const lv = new DataView(local.buffer);
    lv.setUint32(0, 0x04034b50, true);
    lv.setUint16(4, 20, true);
    lv.setUint16(6, 0x0800, true);
    lv.setUint16(8, 0, true);
    lv.setUint16(10, dosTime, true);
    lv.setUint16(12, dosDate, true);
    lv.setUint32(14, crc, true);
    lv.setUint32(18, data.length, true);
    lv.setUint32(22, data.length, true);
    lv.setUint16(26, nameBytes.length, true);
    lv.setUint16(28, 0, true);
    local.set(nameBytes, 30);

    localParts.push(local, data);

    const central = new Uint8Array(46 + nameBytes.length);
    const cv = new DataView(central.buffer);
    cv.setUint32(0, 0x02014b50, true);
    cv.setUint16(4, 20, true);
    cv.setUint16(6, 20, true);
    cv.setUint16(8, 0x0800, true);
    cv.setUint16(10, 0, true);
    cv.setUint16(12, dosTime, true);
    cv.setUint16(14, dosDate, true);
    cv.setUint32(16, crc, true);
    cv.setUint32(20, data.length, true);
    cv.setUint32(24, data.length, true);
    cv.setUint16(28, nameBytes.length, true);
    cv.setUint16(30, 0, true);
    cv.setUint16(32, 0, true);
    cv.setUint16(34, 0, true);
    cv.setUint16(36, 0, true);
    cv.setUint32(38, 0, true);
    cv.setUint32(42, offset, true);
    central.set(nameBytes, 46);

    centralParts.push(central);
    offset += local.length + data.length;
  }

  const centralSize = centralParts.reduce((n, p) => n + p.length, 0);
  const end = new Uint8Array(22);
  const ev = new DataView(end.buffer);
  ev.setUint32(0, 0x06054b50, true);
  ev.setUint16(8, files.length, true);
  ev.setUint16(10, files.length, true);
  ev.setUint32(12, centralSize, true);
  ev.setUint32(16, offset, true);

  const all = localParts.concat(centralParts, [end]);
  const total = all.reduce((n, p) => n + p.length, 0);
  const out = new Uint8Array(total);
  let pos = 0;
  for (const p of all) { out.set(p, pos); pos += p.length; }
  return out;
}

async function saveBytes(filename, bytes) {
  if (nativeApi) {
    const res = await nativeApi.saveFile(filename, bytes);
    if (res && res.canceled) return false;
    if (res && res.ok === false) throw new Error(res.error || '保存失败');
    toast('已保存：' + (res && res.path ? res.path : filename));
    return true;
  }
  const blob = new Blob([bytes]);
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  toast('已下载：' + filename);
  return true;
}

function saveText(filename, text) {
  return saveBytes(filename, new TextEncoder().encode(text));
}

function todayStamp() {
  const d = new Date();
  const p = n => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
}

async function exportLabelPng(box) {
  const cv = drawLabel(box);
  const bytes = await canvasToBytes(cv);
  await saveBytes(posCode(box.cabinet, box.floor, box.slot) + '.png', bytes);
}

async function exportLabelZip(boxes, filename) {
  const files = [];
  for (const b of boxes) {
    const cv = drawLabel(b);
    const bytes = await canvasToBytes(cv);
    files.push({ name: posCode(b.cabinet, b.floor, b.slot) + '.png', data: bytes });
  }
  const zip = zipStore(files);
  await saveBytes(filename || ('暖仓标签_' + todayStamp() + '.zip'), zip);
}

            '<div style="text-align:center">' +
              '<div class="plus">+</div>' +

  modal.innerHTML =

      onReady(modal) {
        modal.querySelector('[data-cancel]').onclick = () => { closeModal(); resolve(false); };
        modal.querySelector('[data-ok]').onclick = () => { closeModal(); resolve(true); };

/* ---------------- 新增 / 编辑 ---------------- */

function positionOptions(cabinetId, floor, slot) {
  const cab = cabinetOf(cabinetId);
  const floors = [];
  for (let f = 1; f <= cab.floors; f++) {
    floors.push('<option value="' + f + '"' + (f === floor ? ' selected' : '') + '>层' + f + (f === 1 ? '（最上层）' : '') + '</option>');
  }
  const slots = [];
  for (let s = 1; s <= cab.perFloor; s++) {
    const taken = boxAt(cab.id, f2(cab, floor), s);
    slots.push('<option value="' + s + '"' + (s === slot ? ' selected' : '') + (taken ? ' disabled' : '') + '>箱' + s + (taken ? '（已占用）' : '') + '</option>');
  }
  return { floors: floors.join(''), slots: slots.join('') };
}

function f2(cab, floor) { return Number(floor) || 1; }

function openBoxForm(mode, box) {
  const isEdit = mode === 'edit';
  const init = box || { cabinet: currentCabinet, floor: 1, slot: 1 };
  const firstFree = (() => {
    if (isEdit) return null;
    for (let s = 1; s <= cabinetOf(init.cabinet).perFloor; s++) {
      if (!boxAt(init.cabinet, init.floor, s)) return s;
    }
    return 1;
  })();
  const initSlot = isEdit ? init.slot : (init.slot && !boxAt(init.cabinet, init.floor, init.slot) ? init.slot : firstFree);

  const cabOptions = CABINETS.map(c =>
    '<option value="' + c.id + '"' + (c.id === init.cabinet ? ' selected' : '') + '>' + c.name + '</option>'
  ).join('');

  const currentCat = box ? box.category : '未分类';
  const catOptions = '<option value="未分类"' + (currentCat === '未分类' ? ' selected' : '') + '>未分类</option>' +
    state.categories.map(c =>
      '<option value="' + escapeHtml(c) + '"' + (currentCat === c ? ' selected' : '') + '>' + escapeHtml(c) + '</option>'
    ).join('');

  const pos = positionOptions(init.cabinet, init.floor, initSlot);

  openModal({
    title: isEdit ? '编辑箱子资料' : '新增箱子',
    bodyHtml:
      '<div class="form-grid">' +
        '<div class="full"><label>位置</label><div class="pos-picker">' +
          '<select id="fCabinet">' + cabOptions + '</select>' +
          '<select id="fFloor">' + pos.floors + '</select>' +
          '<select id="fSlot">' + pos.slots + '</select>' +
        '</div><p class="hint" id="posHint"></p></div>' +
        '<div class="full"><label>箱名 <span class="req">*</span></label>' +
          '<input class="input" id="fName" maxlength="40" placeholder="例如：电动工具" value="' + escapeHtml(box ? box.name : '') + '"></div>' +
        '<div><label>分类</label><select id="fCategory">' + catOptions + '</select></div>' +
        '<div><label>重量（可选，kg）</label><input class="input" id="fWeight" type="number" min="0" max="200" step="0.1" value="' + (box && box.weight != null ? box.weight : '') + '"></div>' +
        '<div class="full"><label>内容关键词 <span class="req">*</span></label>' +
          '<input class="input" id="fKeywords" maxlength="120" placeholder="例如：电钻、螺丝刀、钻头" value="' + escapeHtml(box ? box.keywords : '') + '"></div>' +
        '<div class="full"><label>备注（可选）</label>' +
          '<textarea id="fNote" maxlength="400" placeholder="例如：靠里侧有一盒备用钻头">' + escapeHtml(box ? box.note : '') + '</textarea></div>' +
      '</div>',
    footerHtml:
      '<button class="btn" data-cancel>取消</button>' +
      '<button class="btn btn-primary" id="fSave">' + (isEdit ? '保存' : '创建箱子') + '</button>',
    onReady(modal) {
      const cabSel = modal.querySelector('#fCabinet');
      const floorSel = modal.querySelector('#fFloor');
      const slotSel = modal.querySelector('#fSlot');
      const hint = modal.querySelector('#posHint');

      const refreshPos = () => {
        const cab = cabinetOf(cabSel.value);
        const floor = Number(floorSel.value) || 1;
        const keepSlot = Number(slotSel.value) || 1;
        const p = positionOptions(cab.id, floor, keepSlot);
        floorSel.innerHTML = p.floors;
        slotSel.innerHTML = p.slots;
        if (!slotSel.value) {
          const firstFreeSlot = Array.from(slotSel.options).find(o => !o.disabled);
          if (firstFreeSlot) slotSel.value = firstFreeSlot.value;
        }
        const taken = boxAt(Number(cabSel.value), Number(floorSel.value), Number(slotSel.value));
        hint.textContent = posCn(Number(cabSel.value), Number(floorSel.value), Number(slotSel.value)) +
          ' · ' + posCode(Number(cabSel.value), Number(floorSel.value), Number(slotSel.value)) +
          (taken ? ' · 该位置已占用' : ' · 空闲') +
          (cab.kind === 'flex' ? ' · 灵活柜，保存后创建该箱位' : '');
      };

      cabSel.onchange = () => { floorSel.value = '1'; slotSel.value = '1'; refreshPos(); };
      floorSel.onchange = refreshPos;
      slotSel.onchange = refreshPos;
      refreshPos();

      modal.querySelector('[data-cancel]').onclick = closeModal;
      modal.querySelector('#fSave').onclick = () => {
        const cab = Number(cabSel.value);
        const floor = Number(floorSel.value);
        const slot = Number(slotSel.value);
        const name = modal.querySelector('#fName').value.trim();
        const keywords = modal.querySelector('#fKeywords').value.trim();
        const category = modal.querySelector('#fCategory').value;
        const note = modal.querySelector('#fNote').value.trim();
        const weightRaw = modal.querySelector('#fWeight').value;

        if (!name) return toast('箱名必填');
        if (!keywords) return toast('内容关键词必填');

        const existing = boxAt(cab, floor, slot);
        if (existing && !(isEdit && existing.id === box.id)) return toast('该位置已被「' + existing.name + '」占用');

        const data = { cabinet: cab, floor, slot, name, keywords, category, note, weight: weightRaw === '' ? null : Number(weightRaw) };

        if (isEdit) {
          updateBox(box.id, { name, keywords, category, note, weight: data.weight });
          closeModal();
          renderAll();
          renderDrawer(box.id);
          toast('已保存');
        } else {
          const created = addBox(data);
          closeModal();
          renderAll();
          renderDrawer(created.id);
          toast('已创建：' + posCn(cab, floor, slot));
        }
      };
    }
  });
}

/* ---------------- 移动 / 互换 ---------------- */

function slotButtonHtml(p, extra) {
  return '<button class="btn btn-sm" data-pick="' + p.cabinet + '-' + p.floor + '-' + p.slot + '"' + (extra || '') + '>' +
    posCn(p.cabinet, p.floor, p.slot) + '</button>';
}

function openMoveModal(box) {
  const groups = CABINETS.map(cab => {
    const slots = [];
    for (let f = 1; f <= cab.floors; f++) {
      for (let s = 1; s <= cab.perFloor; s++) {
        if (!boxAt(cab.id, f, s)) slots.push({ cabinet: cab.id, floor: f, slot: s });
      }
    }
    if (!slots.length) return '';
    return '<div class="section"><h4>' + cab.name + ' <span class="badge-soft">' + slots.length + ' 个空位</span></h4>' +
      '<div class="chips">' + slots.map(p => slotButtonHtml(p)).join('') + '</div></div>';
  }).join('');

  openModal({
    title: '移动「' + box.name + '」',
    wide: true,
    bodyHtml: groups || '<p class="hint">没有空位可移动。</p>',
    footerHtml: '<button class="btn" data-cancel>取消</button>',
    onReady(modal) {
      modal.querySelector('[data-cancel]').onclick = closeModal;
      modal.querySelectorAll('[data-pick]').forEach(btn => {
        btn.onclick = () => {
          const [c, f, s] = btn.dataset.pick.split('-').map(Number);
          if (boxAt(c, f, s)) return toast('该位置已被占用');
          moveTo(box, c, f, s);
          closeModal();
          renderAll();
          renderDrawer(box.id);
          toast('已移动到 ' + posCn(c, f, s));
        };
      });
    }
  });
}

function openSwapModal(box) {
  const others = state.boxes
    .filter(b => b.id !== box.id)
    .sort((a, b) => a.cabinet - b.cabinet || a.floor - b.floor || a.slot - b.slot);

  const groups = CABINETS.map(cab => {
    const list = others.filter(b => b.cabinet === cab.id);
    if (!list.length) return '';
    return '<div class="section"><h4>' + cab.name + '</h4><div class="chips">' +
      list.map(b => '<button class="btn btn-sm" data-swap="' + b.id + '">' + escapeHtml(b.name) + ' · ' + posCode(b.cabinet, b.floor, b.slot) + '</button>').join('') +
      '</div></div>';
  }).join('');

  openModal({
    title: '与「' + box.name + '」互换位置',
    wide: true,
    bodyHtml: '<p class="hint">选择另一个箱子，两者位置立即交换，并各自生成新标签。</p>' + (groups || '<p class="hint">没有其他箱子可互换。</p>'),
    footerHtml: '<button class="btn" data-cancel>取消</button>',
    onReady(modal) {
      modal.querySelector('[data-cancel]').onclick = closeModal;
      modal.querySelectorAll('[data-swap]').forEach(btn => {
        btn.onclick = async () => {
          const other = state.boxes.find(b => b.id === btn.dataset.swap);
          if (!other) return;
          const ok = await confirmDialog({
            title: '确认互换',
            text: box.name + '（' + posCn(box.cabinet, box.floor, box.slot) + '）与 ' + other.name + '（' + posCn(other.cabinet, other.floor, other.slot) + '）交换位置。',
            okText: '互换'
          });
          if (!ok) return;
          closeModal();
          swapBoxes(box, other);
          renderAll();
          renderDrawer(box.id);
          toast('已互换，旧标签作废');
        };
      });
    }
  });
}

/* ---------------- 选择空位 ---------------- */

function openSlotPicker(title, onPick) {
  const groups = CABINETS.map(cab => {
    const slots = [];
    for (let f = 1; f <= cab.floors; f++) {
      for (let s = 1; s <= cab.perFloor; s++) {
        if (!boxAt(cab.id, f, s)) slots.push({ cabinet: cab.id, floor: f, slot: s });
      }
    }
    if (!slots.length) return '';
    return '<div class="section"><h4>' + cab.name + '</h4><div class="chips">' +
      slots.map(p => slotButtonHtml(p)).join('') + '</div></div>';
  }).join('');

  openModal({
    title,
    wide: true,
    bodyHtml: groups || '<p class="hint">没有空闲位置。</p>',
    footerHtml: '<button class="btn" data-cancel>取消</button>',
    onReady(modal) {
      modal.querySelector('[data-cancel]').onclick = closeModal;
      modal.querySelectorAll('[data-pick]').forEach(btn => {
        btn.onclick = () => {
          const [c, f, s] = btn.dataset.pick.split('-').map(Number);
          closeModal();
          onPick(c, f, s);
        };
      });
    }
  });
}

/* ---------------- 回收站操作 ---------------- */

function handleRestore(index) {
  const item = state.trash[index];
  if (!item) return;
  const b = item.box;
  if (!boxAt(b.cabinet, b.floor, b.slot)) {
    restoreBox(index, b.cabinet, b.floor, b.slot);
    renderAll();
    toast('已恢复到 ' + posCn(b.cabinet, b.floor, b.slot));
    return;
  }
  openSlotPicker('原位置 ' + posCn(b.cabinet, b.floor, b.slot) + ' 已被占用，选择新位置', (c, f, s) => {
    restoreBox(index, c, f, s);
    renderAll();
    toast('已恢复到 ' + posCn(c, f, s));
  });
}

async function handlePurge(index) {
  const item = state.trash[index];
  if (!item) return;
  const ok = await confirmDialog({
    title: '彻底删除',
    text: '「' + item.box.name + '」将被永久删除，无法恢复。',
    okText: '永久删除',
    danger: true
  });
  if (!ok) return;
  purgeOne(index);
  renderAll();
  toast('已永久删除');
}

/* ---------------- 标签中心 ---------------- */

function openLabelsModal(preselectId) {
  const boxes = state.boxes.slice().sort((a, b) => a.cabinet - b.cabinet || a.floor - b.floor || a.slot - b.slot);
  if (!boxes.length) {
    openModal({
      title: '标签中心',
      bodyHtml: '<div class="empty-hint"><h3>还没有箱子</h3><p>先添加箱子，再导出 50×30 mm 标签。</p></div>',
      footerHtml: '<button class="btn" data-cancel>关闭</button>',
      onReady(modal) { modal.querySelector('[data-cancel]').onclick = closeModal; }
    });
    return;
  }

  const selected = new Set(preselectId ? [preselectId] : []);

  const rows = boxes.map(b =>
    '<label class="label-row' + (selected.has(b.id) ? ' on' : '') + '" data-row="' + b.id + '">' +
      '<input type="checkbox" data-check="' + b.id + '"' + (selected.has(b.id) ? ' checked' : '') + '>' +
      '<span><span class="l-name">' + escapeHtml(b.name) + '</span><br>' +
      '<span class="l-pos">' + posCode(b.cabinet, b.floor, b.slot) + '</span></span>' +
    '</label>'
  ).join('');

  openModal({
    title: '标签中心',
    wide: true,
    bodyHtml:
      '<div class="row" style="margin-bottom:10px">' +
        '<button class="btn btn-sm" id="lblAll">全选</button>' +
        '<button class="btn btn-sm" id="lblNone">清空</button>' +
        '<span class="spacer"></span>' +
        '<span class="hint" id="lblCount"></span>' +
      '</div>' +
      '<div class="label-list" id="lblList">' + rows + '</div>' +
      '<div class="divider"></div>' +
      '<div class="label-preview" id="lblPreview"></div>' +
      '<p class="hint">规格：50×30 mm · 300 dpi · 白底 · Code 128 一维条码，条码内容为 ASCII 位置码。</p>',
    footerHtml:
      '<button class="btn" data-cancel>关闭</button>' +
      '<button class="btn" id="lblZipSel">导出所选 ZIP</button>' +
      '<button class="btn btn-primary" id="lblZipAll">全部导出 ZIP</button>',
    onReady(modal) {
      const list = modal.querySelector('#lblList');
      const preview = modal.querySelector('#lblPreview');
      const count = modal.querySelector('#lblCount');

      const refresh = () => {
        list.querySelectorAll('[data-row]').forEach(row => {
          row.classList.toggle('on', selected.has(row.dataset.row));
          const cb = row.querySelector('input');
          if (cb) cb.checked = selected.has(row.dataset.row);
        });
        count.textContent = '已选 ' + selected.size + ' / ' + boxes.length + ' 箱';
        const first = boxes.find(b => selected.has(b.id));
        preview.innerHTML = '';
        if (first) {
          const cv = drawLabel(first);
          preview.appendChild(cv);
        } else {
          preview.innerHTML = '<span class="hint">勾选箱子后在此预览标签</span>';
        }
      };

      list.addEventListener('click', e => {
        const row = e.target.closest('[data-row]');
        if (!row) return;
        e.preventDefault();
        const id = row.dataset.row;
        if (selected.has(id)) selected.delete(id); else selected.add(id);
        refresh();
      });

      modal.querySelector('#lblAll').onclick = () => { boxes.forEach(b => selected.add(b.id)); refresh(); };
      modal.querySelector('#lblNone').onclick = () => { selected.clear(); refresh(); };
      modal.querySelector('[data-cancel]').onclick = closeModal;

      modal.querySelector('#lblZipSel').onclick = async () => {
        const chosen = boxes.filter(b => selected.has(b.id));
        if (!chosen.length) return toast('请先勾选箱子');
        try {
          await exportLabelZip(chosen, '暖仓标签_选中_' + todayStamp() + '.zip');
        } catch (err) { toast(err.message); }
      };

      modal.querySelector('#lblZipAll').onclick = async () => {
        try {
          await exportLabelZip(boxes, '暖仓标签_全部_' + todayStamp() + '.zip');
        } catch (err) { toast(err.message); }
      };

      refresh();
    }
  });
}

/* ---------------- 设置与备份 ---------------- */

async function openSettingsModal() {
  let dataPath = '浏览器本地存储（localStorage）';
  if (nativeApi) {
    try { dataPath = await nativeApi.dataPath(); } catch (e) { dataPath = '读取失败'; }
  }

  openModal({
    title: '设置与备份',
    wide: true,
    bodyHtml:
      '<div class="section"><h4>分类</h4>' +
        '<p class="desc">预设分类可删除，新增分类会出现在新增与筛选里。</p>' +
        '<div class="chips" id="catChips"></div>' +
        '<div class="row" style="margin-top:10px">' +
          '<input class="input" id="catInput" style="max-width:220px" maxlength="12" placeholder="新分类名称">' +
          '<button class="btn btn-sm" id="catAdd">添加分类</button>' +
        '</div>' +
      '</div>' +
      '<div class="divider"></div>' +
      '<div class="section"><h4>数据</h4>' +
        '<p class="desc">数据文件位置：</p>' +
        '<div class="mono" style="font-size:12px; word-break:break-all; background:#fffdf9; border:1px solid var(--line); border-radius:8px; padding:8px 10px">' + escapeHtml(dataPath) + '</div>' +
        '<div class="row" style="margin-top:10px">' +
          (nativeApi ? '<button class="btn btn-sm" id="btnReveal">打开所在文件夹</button>' : '') +
          '<button class="btn btn-sm" id="btnBackup">导出备份 JSON</button>' +
          '<button class="btn btn-sm" id="btnRestore">从备份恢复</button>' +
        '</div>' +
        '<p class="hint">备份包含箱子、分类、移动记录和回收站。恢复会覆盖当前数据。</p>' +
      '</div>' +
      '<div class="divider"></div>' +
      '<div class="section"><h4>关于</h4>' +
        '<p class="desc">暖仓 ' + APP_VERSION + ' · 单机单用户 · 不联网、无账号、无密码。</p>' +
        '<p class="hint">删除的箱子在回收站保留 30 天；到期清理只在打开暖仓时执行。两台电脑不要同时编辑同一份数据文件。</p>' +
      '</div>',
    footerHtml: '<button class="btn" data-cancel>关闭</button>',
    onReady(modal) {
      const chips = modal.querySelector('#catChips');

      const renderCats = () => {
        chips.innerHTML = state.categories.map((c, i) =>
          '<span class="chip"><i class="cat-dot" style="background:' + catColor(c) + '"></i>' + escapeHtml(c) +
          ' <button class="x" data-del-cat="' + i + '" title="删除分类" style="border:none;background:none;padding:0;cursor:pointer">×</button></span>'
        ).join('');
      };
      renderCats();

      chips.addEventListener('click', async e => {
        const btn = e.target.closest('[data-del-cat]');
        if (!btn) return;
        const idx = Number(btn.dataset.delCat);
        const name = state.categories[idx];
        const used = state.boxes.filter(b => b.category === name).length;
        const ok = await confirmDialog({
          title: '删除分类',
          text: used ? '「' + name + '」下有 ' + used + ' 个箱子，删除后这些箱子改为「未分类」。' : '删除分类「' + name + '」。',
          okText: '删除',
          danger: true
        });
        if (!ok) return;
        state.categories.splice(idx, 1);
        state.boxes.forEach(b => { if (b.category === name) b.category = '未分类'; });
        touch('category');
        renderCats();
        renderAll();
      });

      modal.querySelector('#catAdd').onclick = () => {
        const input = modal.querySelector('#catInput');
        const name = input.value.trim();
        if (!name) return toast('请输入分类名称');
        if (state.categories.includes(name)) return toast('分类已存在');
        state.categories.push(name);
        input.value = '';
        touch('category');
        renderCats();
        renderAll();
      };

      const reveal = modal.querySelector('#btnReveal');
      if (reveal) reveal.onclick = () => nativeApi.reveal(dataPath);

      modal.querySelector('#btnBackup').onclick = async () => {
        try {
          const text = JSON.stringify(state, null, 2);
          await saveText('暖仓备份_' + todayStamp() + '.json', text);
        } catch (err) { toast(err.message); }
      };

      modal.querySelector('#btnRestore').onclick = () => importBackup();

      modal.querySelector('[data-cancel]').onclick = closeModal;
    }
  });
}

async function importBackup() {
  let text = null;
  try {
    if (nativeApi) {
      const res = await nativeApi.openFile('backup');
      if (!res || res.canceled) return;
      text = res.text;
    } else {
      text = await pickFileText('.json,application/json');
    }
  } catch (err) {
    toast('读取失败：' + err.message);
    return;
  }
  if (!text) return;

  let parsed;
  try { parsed = JSON.parse(text); }
  catch (e) { return toast('备份文件不是有效的 JSON'); }

  if (!parsed || !Array.isArray(parsed.boxes)) return toast('备份内容缺少 boxes 字段');

  const ok = await confirmDialog({
    title: '从备份恢复',
    text: '将用备份中的 ' + parsed.boxes.length + ' 个箱子、' + (Array.isArray(parsed.trash) ? parsed.trash.length : 0) + ' 条回收站记录覆盖当前数据。',
    okText: '覆盖恢复',
    danger: true
  });
  if (!ok) return;

  state = normalizeState(parsed);
  touch('restore-backup');
  await saveNow();
  renderAll();
  closeModal();
  toast('已从备份恢复');
}

function pickFileText(accept) {
  return new Promise(resolve => {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = accept;
    input.onchange = () => {
      const f = input.files && input.files[0];
      if (!f) return resolve(null);
      const reader = new FileReader();
      reader.onload = () => resolve(String(reader.result || ''));
      reader.onerror = () => resolve(null);
      reader.readAsText(f);
    };
    input.click();
  });
}

/* ---------------- 搜索 ---------------- */

let searchTimer = null;

function runSearch(query) {
  const panel = $('#searchPanel');
  const q = query.trim();
  if (!q) {
    panel.hidden = true;
    panel.innerHTML = '';
    return;
  }
  const hits = state.boxes.filter(b => boxMatches(b, q)).slice(0, 30);

  if (!hits.length) {
    panel.innerHTML = '<div class="result-empty">没有找到与「' + escapeHtml(q) + '」匹配的箱子</div>';
    panel.hidden = false;
    return;
  }

  panel.innerHTML = hits.map(b =>
    '<div class="result" data-result="' + b.id + '">' +
      '<div class="r-name">' + highlight(b.name, q) + '</div>' +
      '<div class="r-pos">' + posCode(b.cabinet, b.floor, b.slot) + '</div>' +
      '<div class="r-sub">' + posCn(b.cabinet, b.floor, b.slot) + ' · ' + highlight(b.category || '未分类', q) +
        (b.keywords ? ' · ' + highlight(b.keywords, q) : '') + '</div>' +
    '</div>'
  ).join('');
  panel.hidden = false;
}

function focusBoxFromSearch(id) {
  const box = state.boxes.find(b => b.id === id);
  if (!box) return;
  $('#searchPanel').hidden = true;
  switchView('cabinet', box.cabinet);
  renderDrawer(box.id);
}

/* ---------------- 全局渲染 ---------------- */

function renderAll() {
  renderStats();
  updateTrashBadge();
  if (currentView === 'room') renderRoom();
  if (currentView === 'cabinet') renderCabinet(currentCabinet);
  if (currentView === 'trash') renderTrash();
  if (openBoxId) renderDrawer(openBoxId);
}

/* ---------------- 事件绑定 ---------------- */

function bindEvents() {
  $('#planSvg').addEventListener('click', e => {
    const node = e.target.closest('.cabinet-node');
    if (node) switchView('cabinet', Number(node.dataset.cab));
  });
  $('#planSvg').addEventListener('keydown', e => {
    const node = e.target.closest('.cabinet-node');
    if (node && (e.key === 'Enter' || e.key === ' ')) {
      e.preventDefault();
      switchView('cabinet', Number(node.dataset.cab));
    }
  });

  $('#floors').addEventListener('click', e => {
    const boxEl = e.target.closest('[data-box]');
    if (boxEl) return renderDrawer(boxEl.dataset.box);
    const addEl = e.target.closest('[data-add]');
    if (addEl) {
      const [c, f, s] = addEl.dataset.add.split('-').map(Number);
      openBoxForm('add', { cabinet: c, floor: f, slot: s });
    }
  });

  $('#btnAddHere').onclick = () => openBoxForm('add', { cabinet: currentCabinet, floor: 1, slot: 1 });

  $('#trashList').addEventListener('click', e => {
    const r = e.target.closest('[data-restore]');
    if (r) return handleRestore(Number(r.dataset.restore));
    const p = e.target.closest('[data-purge]');
    if (p) return handlePurge(Number(p.dataset.purge));
  });

  document.addEventListener('click', e => {
    const nav = e.target.closest('[data-nav]');
    if (nav) switchView(nav.dataset.nav);
  });

  $('#btnLabels').onclick = () => openLabelsModal();
  $('#btnTrash').onclick = () => switchView('trash');
  $('#btnSettings').onclick = () => openSettingsModal();
  $('#drawerBackdrop').onclick = closeDrawer;

  const input = $('#searchInput');
  input.addEventListener('input', () => {
    if (searchTimer) clearTimeout(searchTimer);
    searchTimer = setTimeout(() => runSearch(input.value), 120);
  });
  input.addEventListener('focus', () => { if (input.value.trim()) runSearch(input.value); });
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      const first = $('#searchPanel .result');
      if (first) focusBoxFromSearch(first.dataset.result);
    }
    if (e.key === 'Escape') {
      input.value = '';
      $('#searchPanel').hidden = true;
      input.blur();
    }
  });

  $('#searchPanel').addEventListener('click', e => {
    const r = e.target.closest('[data-result]');
    if (r) focusBoxFromSearch(r.dataset.result);
  });

  document.addEventListener('mousedown', e => {
    if (!e.target.closest('.search')) $('#searchPanel').hidden = true;
  });

  document.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
      e.preventDefault();
      input.focus();
      input.select();
    }
    if (e.key === 'Escape') {
      if (activeModal) return closeModal();
      if (openBoxId) return closeDrawer();
    }
  });

  window.addEventListener('beforeunload', () => { if (saveTimer) saveNow(); });
}

/* ---------------- 启动 ---------------- */

async function boot() {
  $('#versionBadge').textContent = APP_VERSION;
  bindEvents();
  await loadState();
  updateTrashBadge();
  switchView('room');
  if (nativeApi) {
    try {
      const v = await nativeApi.appVersion();
      if (v) console.info('暖仓', APP_VERSION, '运行于', v);
    } catch (e) { /* ignore */ }
  }
}

document.addEventListener('DOMContentLoaded', boot);
